[preferred]
# Use xdg-desktop-portal-gtk for file choosers, app choosers, etc.
default=gtk
# Use xdg-desktop-portal-wlr for screen sharing and screenshots
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
# Disable Inhibit portal to prevent D-Bus stalls on non-existent org.freedesktop.ScreenSaver
# (Idle inhibition is natively handled in Sway via wayland-pipewire-idle-inhibit)
org.freedesktop.impl.portal.Inhibit=none
