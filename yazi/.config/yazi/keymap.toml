# A TOML linter such as Tombi can use this schema to validate your config.
#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]

prepend_keymap = [
	# Open file or enter directory with 'l'
	{ on = "l", run = "plugin smart-enter", desc = "Enter child directory or open file" },
	{ on = "<Right>", run = "plugin smart-enter", desc = "Enter child directory or open file" },

	# Preview scrolling with Ctrl+u / Ctrl+d
	{ on = "<C-u>", run = "seek -5", desc = "Seek up 5 units in the preview" },
	{ on = "<C-d>", run = "seek 5",  desc = "Seek down 5 units in the preview" },
	{ on = "K", run = "arrow -50%",  desc = "Move cursor up half page" },
	{ on = "J", run = "arrow 50%",   desc = "Move cursor down half page" },

	# Yank
	{ on = ["y", "y"], run = "yank",                  desc = "Yank selected files" },
	{ on = ["y", "p"], run = "copy path",             desc = "Copy file path" },
	{ on = ["y", "P"], run = "copy url",              desc = "Copy file URL" },
	{ on = ["y", "d"], run = "copy dirpath",          desc = "Copy directory path" },
	{ on = ["y", "D"], run = "copy dirurl",           desc = "Copy directory URL" },
	{ on = ["y", "f"], run = "copy filename",         desc = "Copy filename" },
	{ on = ["y", "n"], run = "copy name_without_ext", desc = "Copy filename without extension" },
	{ on = ["d", "d"],   run = "yank --cut",            desc = "Cut selected files" },

    # Paste
	{ on = ["p", "p"],     run = "paste",                    desc = "Paste yanked files" },
	{ on = ["p", "P"],     run = "paste --force",            desc = "Paste yanked files (overwrite if the destination exists)" },
	{ on = ["p", "r"],     run = "plugin bashsudo -- paste", desc = "Paste yanked files as root" },
	{ on = ["p", "l"],     run = "link",                     desc = "Symlink the absolute path of yanked files" },
	{ on = ["p", "L"],     run = "link --relative",          desc = "Symlink the relative path of yanked files" },
	{ on = ["p", "<C-l>"], run = "hardlink",                 desc = "Hardlink yanked files" },

    # Undo
	{ on = ["u", "y"], run = "unyank",                 desc = "Cancel the yank status" },
	{ on = ["u", "v"], run = "toggle_all --state=off", desc = "Unselect all files" },

	# Directory navigation shortcuts
	{ on = ["g", "d"], run = "cd ~/.dotfiles", desc = "Go to ~/.dotfiles" },
	{ on = ["g", "w"], run = "cd ~/Downloads", desc = "Go to ~/Downloads" },
	{ on = ["g", "v"], run = "cd ~/Videos", desc = "Go to ~/Videos" },
	{ on = ["g", "p"], run = "cd ~/work_projects", desc = "Go to ~/work_projects" },
	{ on = ["g", "l"], run = "cd ~/.local", desc = "Go to ~/.local" },
	{ on = ["g", "a"], run = "cd ~/Apps", desc = "Go to ~/Apps" },
	{ on = ["g", "o"], run = "cd ~/Documents/notes", desc = "Go to ~/Documents/notes" },
	{ on = ["g", "i"], run = "cd /run/media", desc = "Go to removable media mount point" },

	# Sub-terminal in current directory (S remains rg search)
	{ on = "T", run = 'shell "$SHELL" --block', desc = "Open sub-shell in current directory" },

	# Run shell command with selected files
	{ on = "@", run = 'shell --block --interactive " %s" --cursor=0', desc = "Run shell command with selected files" },

	# Fuzzy finder
	{ on = "<C-f>", run = "plugin fzf", desc = "Fuzzy search with fzf" },

	# Sorting
	{ on = ["o", "m"], run = ["sort mtime --reverse=no", "linemode mtime"],  desc = "Sort by modified time" },
	{ on = ["o", "M"], run = ["sort mtime --reverse=yes", "linemode mtime"], desc = "Sort by modified time (reverse)" },
	{ on = ["o", "b"], run = ["sort btime --reverse=no", "linemode btime"],  desc = "Sort by birth time" },
	{ on = ["o", "B"], run = ["sort btime --reverse=yes", "linemode btime"], desc = "Sort by birth time (reverse)" },
	{ on = ["o", "e"], run = "sort extension --reverse=no",                    desc = "Sort by extension" },
	{ on = ["o", "E"], run = "sort extension --reverse=yes",                   desc = "Sort by extension (reverse)" },
	{ on = ["o", "a"], run = "sort alphabetical --reverse=no",                 desc = "Sort alphabetically" },
	{ on = ["o", "A"], run = "sort alphabetical --reverse=yes",                desc = "Sort alphabetically (reverse)" },
	{ on = ["o", "n"], run = "sort natural --reverse=no",                      desc = "Sort naturally" },
	{ on = ["o", "N"], run = "sort natural --reverse=yes",                     desc = "Sort naturally (reverse)" },
	{ on = ["o", "s"], run = ["sort size --reverse=no", "linemode size"],    desc = "Sort by size" },
	{ on = ["o", "S"], run = ["sort size --reverse=yes", "linemode size"],   desc = "Sort by size (reverse)" },
	{ on = ["o", "r"], run = "sort random --reverse=no",                       desc = "Sort randomly" },
]


[input]

prepend_keymap = [
    # Exit to normal mode with C-c, ESC is close
	{ on = "<Esc>",   run = "close",          desc = "Cancel input" },
	{ on = "<C-c>",   run = "escape",         desc = "Back to normal mode, or cancel input" },
]
